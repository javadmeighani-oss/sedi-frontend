name: sedi_app
description: Sedi Intelligent Health Assistant
publish_to: "none"

version: 1.1.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter_timezone: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.0
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.1
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.3
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  record: ^5.2.1
  path_provider: ^2.1.2
  flutter_reactive_ble: 5.4.1

dependency_overrides:
  record_linux: ^1.0.0  # Fix compatibility with record_platform_interface (startStream, hasPermission)

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # R-041: licensed fonts bundled per language (all SIL OFL, licences next to the files in assets/fonts):
  # Persian = Vazirmatn, English = IBM Plex Sans, Arabic = IBM Plex Sans Arabic (a designed Latin + Arabic pair).
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800

