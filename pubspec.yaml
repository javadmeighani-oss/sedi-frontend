name: sedi_app
description: Sedi Intelligent Health Assistant
publish_to: "none"

version: 1.1.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter_timezone: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.1
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.3
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  record: ^5.2.1
  path_provider: ^2.1.2
  flutter_reactive_ble: 5.4.1

dependency_overrides:
  record_linux: ^1.0.0  # Fix compatibility with record_platform_interface (startStream, hasPermission)

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

