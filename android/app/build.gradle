// Google Services plugin requires android/app/google-services.json for FCM.
// For real-device FCM: add your project's file from Firebase Console (package com.sedi.app). See README-google-services.md.
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Physical CI signing is env-driven only. Local checkouts without these
// variables keep ordinary debug signing and never fabricate secrets.
def sediKeystorePath = System.getenv("SEDI_ANDROID_KEYSTORE_PATH")
def sediKeyAlias = System.getenv("SEDI_ANDROID_KEY_ALIAS")
def sediStorePassword = System.getenv("SEDI_ANDROID_KEYSTORE_PASSWORD")
def sediKeyPassword = System.getenv("SEDI_ANDROID_KEY_PASSWORD")
def useSediPhysicalSigning = false
if (sediKeystorePath && sediKeyAlias && sediStorePassword && sediKeyPassword) {
    def kf = file(sediKeystorePath)
    if (!kf.isFile()) {
        throw new GradleException("SEDI physical signing env is set but keystore file is missing")
    }
    useSediPhysicalSigning = true
}

android {
    namespace "com.sedi.app"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.sedi.app"
        minSdk 23  // record_android requires min 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (useSediPhysicalSigning) {
            sediPhysical {
                storeFile file(sediKeystorePath)
                storePassword sediStorePassword
                keyAlias sediKeyAlias
                keyPassword sediKeyPassword
                storeType "pkcs12"
            }
        }
    }

    buildTypes {
        debug {
            if (useSediPhysicalSigning) {
                signingConfig signingConfigs.sediPhysical
            }
        }
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.23"
}
