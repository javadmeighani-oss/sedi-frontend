name: Frontend Android Debug APK

# Canonical physical real-Firebase debug APK authority for sedi-frontend.
# Fail-closed: placeholder google-services.json.ci is NEVER accepted here.

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Canonical Real-Firebase Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Canonical frontend + API + graph preflight
        run: |
          set -euo pipefail
          echo "CANONICAL_FRONTEND=YES"
          test -f lib/features/intro/presentation/pages/intro_page.dart
          test -f lib/features/auth_otp/presentation/pages/otp_login_page.dart
          test -f lib/features/gate3_interactive/presentation/pages/gate3_interactive_page.dart
          test -f lib/core/navigation/app_gate_router.dart
          test -f lib/core/navigation/session_gate_resolver.dart
          test -f lib/features/notifications/presentation/pages/notification_inbox_page.dart
          test ! -f lib/features/chat/presentation/pages/chat_page.dart
          test ! -d lib/features/notification
          grep -q 'https://api.sedi-ai.com' lib/core/config/app_config.dart
          grep -q 'applicationId "com.sedi.app"' android/app/build.gradle
          ROW=lib/features/gate3_interactive/presentation/widgets/gate3_main_icon_row.dart
          grep -q 'Profile | Lifestyle | Gadgets | Smart Notifications' "$ROW"
          GATE3=lib/features/gate3_interactive/presentation/pages/gate3_interactive_page.dart
          grep -q 'NotificationInboxPage' "$GATE3"
          ! grep -q 'ChatPage' "$GATE3"
          echo "A1_A2_A3_GRAPH=PASS"
          echo "API_BASE=https://api.sedi-ai.com"
          echo "ANDROID_PACKAGE=com.sedi.app"
          echo "LEGACY_CHAT_ROUTE=ABSENT"

      - name: Provide real google-services.json from secret (fail-closed)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          GS="android/app/google-services.json"
          mkdir -p "$(dirname "$GS")"
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "FAIL: GOOGLE_SERVICES_JSON repository secret is missing/empty"
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > "$GS"
          if grep -q "sedi-ci-placeholder" "$GS"; then
            echo "FAIL: placeholder sedi-ci-placeholder detected; real Firebase config required"
            exit 1
          fi
          if ! grep -q '"project_id"' "$GS"; then
            echo "FAIL: google-services.json missing project_id"
            exit 1
          fi
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('$GS')).get('project_info',{}).get('project_id',''))")
          PACKAGE_NAME=$(python3 -c "import json; c=json.load(open('$GS')).get('client',[{}])[0]; print(c.get('client_info',{}).get('android_client_info',{}).get('package_name',''))")
          echo "REAL_GOOGLE_SERVICES_CONFIG_USED=YES"
          echo "GOOGLE_SERVICES_PROJECT_ID=${PROJECT_ID}"
          echo "ANDROID_PACKAGE_FROM_GOOGLE_SERVICES=${PACKAGE_NAME}"
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "sedi-ci-placeholder" ]; then
            echo "FAIL: invalid google-services project_id"
            exit 1
          fi
          if [ "$PROJECT_ID" != "sedi-b0f08" ]; then
            echo "FAIL: project_id must be sedi-b0f08 (got ${PROJECT_ID})"
            exit 1
          fi
          if [ "$PACKAGE_NAME" != "com.sedi.app" ]; then
            echo "FAIL: package_name must be com.sedi.app (got ${PACKAGE_NAME})"
            exit 1
          fi
          echo "PLACEHOLDER_PHYSICAL_BUILD_ALLOWED=NO"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (fail on errors only; C1 legacy warnings non-blocking)
        run: |
          set +e
          flutter analyze > analyze_out.txt 2>&1
          status=$?
          cat analyze_out.txt
          if grep -E "error •" analyze_out.txt; then
            echo "Analyzer reported errors"
            exit 1
          fi
          echo "No analyzer errors (warnings/infos non-blocking for this Gate)"
          exit 0

      - name: Targeted Android network-security canonicalization tests
        run: flutter test test/android_network_security_canonical_test.dart

      - name: Targeted A3 authority foundation tests
        run: flutter test test/a3_authority_foundation_test.dart

      - name: Targeted A3 phone-change tests
        run: flutter test test/a3_phone_change_otp_test.dart

      - name: Targeted A3 SELF/OTHER subject authority tests
        run: flutter test test/a3_self_other_subject_authority_test.dart

      - name: Targeted A3 single-page profile tests
        run: flutter test test/a3_single_page_profile_test.dart

      - name: Targeted R3 canonical structure and legacy quarantine tests
        run: flutter test test/r3_canonical_structure_legacy_quarantine_test.dart

      - name: Targeted R1 session identity and empty-state tests
        run: |
          flutter test \
            test/r1_session_identity_empty_state_test.dart \
            test/session_gate_resolver_test.dart \
            test/gate3_localization_test.dart

      - name: Targeted A3 lifestyle hub tests
        run: |
          flutter test \
            test/a3_lifestyle_hub_minimal_test.dart \
            test/a3_shared_back_navigation_test.dart \
            test/a3_a4_coherent_ux_recovery_test.dart \
            test/a0_a4_recovery_contract_test.dart \
            test/r2_lifestyle_authority_alignment_test.dart \
            test/lifestyle_hr_device_reported_render_test.dart

      - name: Targeted A3 FE1 Smart Notifications icon/badge/inbox tests
        run: |
          flutter test \
            test/a3_fe1_icon_badge_inbox_test.dart \
            test/a3_g1_inbox_wiring_test.dart \
            test/notification_sync_and_badge_test.dart

      - name: Targeted A2 functional alignment tests
        run: |
          flutter test \
            test/sedi_locale_foundation_test.dart \
            test/a2_stable_enable_test.dart \
            test/a2_phone_e164_test.dart \
            test/a2_ui_functional_alignment_test.dart \
            test/gate2_post_otp_safe_router_test.dart \
            test/gate2_otp_input_helper_test.dart

      - name: Targeted G2 Gadgets contract tests
        run: |
          flutter test \
            test/device_dto_test.dart \
            test/devices_controller_actions_test.dart \
            test/devices_g2_contract_test.dart

      - name: Targeted PushDevice install-id registration tests
        run: flutter test test/mobile_install_id_and_push_register_test.dart

      - name: Targeted known-issues consolidated closure tests
        run: |
          flutter test \
            test/auth_refresh_single_flight_test.dart \
            test/frontend_known_issues_closure_test.dart \
            test/session_gate_resolver_test.dart \
            test/g1_b1_transient_coldstart_routing_test.dart \
            test/a3_a4_coherent_ux_recovery_test.dart \
            test/a0_a4_recovery_contract_test.dart \
            test/gate3_localization_test.dart \
            test/sedi_locale_foundation_test.dart \
            test/mobile_install_id_and_push_register_test.dart

      - name: Final frontend closure regression tests
        run: |
          flutter test \
            test/a1_a2_ux_closure_test.dart \
            test/a3_destination_local_timestamp_test.dart \
            test/a3_destinations_ux_coherence_test.dart \
            test/a3_entry_bootstrap_visual_test.dart \
            test/a3_gadgets_ux_g_test.dart \
            test/a3_lifestyle_health_l2_ux_test.dart \
            test/a3_lifestyle_history_l3_ux_test.dart \
            test/a3_lifestyle_hub_l1_test.dart \
            test/a3_lifestyle_schedule_l4_ux_test.dart \
            test/a3_lifestyle_weekly_plan_l5_ux_test.dart \
            test/a3_lifestyle_weekly_plan_ui_test.dart \
            test/a3_main_home_redesign_test.dart \
            test/a3_notifications_ux_n_test.dart \
            test/a3_profile_ux_p_test.dart \
            test/a3_top_action_row_layout_test.dart \
            test/a3_user_edit_icon_outside_bubble_test.dart \
            test/gadgets_g9_a3_visual_permission_test.dart \
            test/gate2_auth_me_profile_parser_test.dart \
            test/gate2_otp_input_widget_test.dart \
            test/gate2_otp_paste_and_slot_edit_test.dart \
            test/gate2_post_otp_auth_me_runtime_test.dart \
            test/gate2_post_otp_profile_load_test.dart \
            test/gate2_post_otp_router_test.dart

      - name: Prepare Sedi physical signing (fail-closed)
        env:
          SEDI_ANDROID_KEYSTORE_B64: ${{ secrets.SEDI_ANDROID_KEYSTORE_B64 }}
          SEDI_ANDROID_KEY_ALIAS: ${{ secrets.SEDI_ANDROID_KEY_ALIAS }}
          SEDI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SEDI_ANDROID_KEYSTORE_PASSWORD }}
          SEDI_ANDROID_KEY_PASSWORD: ${{ secrets.SEDI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SEDI_ANDROID_KEYSTORE_B64:-}" ] || \
             [ -z "${SEDI_ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${SEDI_ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${SEDI_ANDROID_KEY_PASSWORD:-}" ]; then
            echo "FAIL: one or more Sedi Android signing secrets are absent"
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/sedi-physical-update.p12"
          printf '%s' "$SEDI_ANDROID_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          echo "SEDI_ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
          echo "SEDI_PHYSICAL_BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "SEDI_PHYSICAL_SIGNING_PREPARED=YES"
          echo "PHYSICAL_BUILD_NUMBER=${BUILD_NUMBER}"

      - name: Build debug APK
        env:
          SEDI_ANDROID_KEYSTORE_PATH: ${{ env.SEDI_ANDROID_KEYSTORE_PATH }}
          SEDI_ANDROID_KEY_ALIAS: ${{ secrets.SEDI_ANDROID_KEY_ALIAS }}
          SEDI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SEDI_ANDROID_KEYSTORE_PASSWORD }}
          SEDI_ANDROID_KEY_PASSWORD: ${{ secrets.SEDI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${SEDI_PHYSICAL_BUILD_NUMBER:?FAIL missing physical build number}"
          flutter build apk --debug --build-number "$BUILD_NUMBER"

      - name: Verify physical APK package, versionCode, and signer (fail-closed)
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          EXPECTED_FP_FILE="android/signing/sedi_physical_cert_sha256.txt"
          test -f "$EXPECTED_FP_FILE"
          EXPECTED_FP=$(tr -d '[:space:]:' < "$EXPECTED_FP_FILE" | tr 'A-F' 'a-f')
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "FAIL: ANDROID_SDK_ROOT/ANDROID_HOME unset"
            exit 1
          fi
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort | tail -n1)
          if [ -z "$BT" ]; then
            echo "FAIL: Android build-tools not found"
            exit 1
          fi
          AAPT="$BT/aapt"
          APKSIGNER="$BT/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK")
          PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)'.*/\1/p")
          echo "APK_PACKAGE=${PACKAGE}"
          echo "APK_VERSION_CODE=${VERSION_CODE}"
          echo "EXPECTED_VERSION_CODE=${SEDI_PHYSICAL_BUILD_NUMBER}"
          if [ "$PACKAGE" != "com.sedi.app" ]; then
            echo "FAIL: package mismatch"
            exit 1
          fi
          if [ "$VERSION_CODE" != "$SEDI_PHYSICAL_BUILD_NUMBER" ]; then
            echo "FAIL: versionCode mismatch"
            exit 1
          fi
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          SIGNER_COUNT=$(printf '%s\n' "$CERTS" | grep -c 'Signer #.*certificate SHA-256 digest:' || true)
          if [ "$SIGNER_COUNT" != "1" ]; then
            echo "FAIL: expected exactly one signer, got ${SIGNER_COUNT}"
            exit 1
          fi
          ACTUAL_FP=$(printf '%s\n' "$CERTS" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' | head -n1 | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "FAIL: signer SHA-256 mismatch"
            echo "EXPECTED_FP=${EXPECTED_FP}"
            echo "ACTUAL_FP=${ACTUAL_FP}"
            exit 1
          fi
          echo "PHYSICAL_SIGNER_VERIFIED=YES"

      - name: Upload canonical real-Firebase debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sedi-canonical-real-firebase-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
